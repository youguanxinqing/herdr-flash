[package]
name = "herdr-flash"
version = "0.3.0"
edition = "2021"
description = "Herdr plugin for flash.nvim-style search, select, and yank over visible pane text"
repository = "https://github.com/youguanxinqing/herdr-flash"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
unicode-width = "0.2.2"
which = "6.0"

[dev-dependencies]
pretty_assertions = "1.4"
